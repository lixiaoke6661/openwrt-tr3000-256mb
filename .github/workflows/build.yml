name: Build OpenWrt for Cudy TR3000 256MB

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenWrt git ref (tag or branch)"
        required: true
        default: "v25.12.6"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc \
            ccache libelf-dev

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch "${{ inputs.ref }}" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --format='%H %s'

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/configs/cudy_tr3000-256mb-v1.config" .config
          cp -r "$GITHUB_WORKSPACE/files" .
          make defconfig
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y" .config
          grep -E "CONFIG_PACKAGE_(luci|luci-ssl|kmod-tun|kmod-nft-tproxy)=y" .config

      - name: Download sources
        run: cd openwrt && make download -j8

      - name: Build
        run: cd openwrt && make -j$(nproc) V=s

      - name: Collect artifacts
        run: |
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp bin/targets/mediatek/filogic/*sysupgrade.bin "$GITHUB_WORKSPACE/out/" || true
          cp bin/targets/mediatek/filogic/*initramfs* "$GITHUB_WORKSPACE/out/" || true
          cp bin/targets/mediatek/filogic/*.manifest "$GITHUB_WORKSPACE/out/" || true
          cp bin/targets/mediatek/filogic/config.buildinfo "$GITHUB_WORKSPACE/out/" || true
          cp bin/targets/mediatek/filogic/sha256sums "$GITHUB_WORKSPACE/out/" || true
          cd "$GITHUB_WORKSPACE/out"
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.ref }}-tr3000-256mb
          path: out/
          retention-days: 14
