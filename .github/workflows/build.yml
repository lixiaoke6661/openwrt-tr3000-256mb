name: Build OpenWrt for Cudy TR3000 256MB

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenWrt git ref (tag or branch)"
        required: true
        default: "v25.12.6"
      mode:
        description: "Build mode"
        required: true
        type: choice
        default: "full"
        options:
          - full          # full firmware image
          - kernel        # kernel + modules only (fast patch/compile check)

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      REF: ${{ inputs.ref || 'v25.12.6' }}
      MODE: ${{ inputs.mode || 'full' }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc \
            ccache libelf-dev

      - name: Clone OpenWrt
        run: |
          git clone --depth 1 --branch "${{ env.REF }}" https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --format='%H %s'

      - name: Restore build cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: owrt-${{ inputs.ref || 'v25.12.6' }}-${{ hashFiles('configs/**', 'patches/**', 'files/**') }}
          restore-keys: |
            owrt-${{ inputs.ref || 'v25.12.6' }}-

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/configs/cudy_tr3000-256mb-v1.config" .config
          cp -r "$GITHUB_WORKSPACE/files" .
          chmod +x files/etc/uci-defaults/* 2>/dev/null || true
          make defconfig
          grep -q "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-256mb-v1=y" .config
          echo "device symbol OK"

      - name: Download sources
        run: cd openwrt && make download -j8 || echo "[WARN] some downloads failed, build will retry"

      - name: Build toolchain
        run: cd openwrt && make -j$(nproc) toolchain/install V=s

      - name: Build (kernel only)
        if: env.MODE == 'kernel'
        run: |
          cd openwrt
          make -j$(nproc) target/linux/compile V=s
          echo "--- kernel object check ---"
          find build_dir/target-*/linux-*/linux-* -name "*.o" | wc -l

      - name: Build (full)
        if: env.MODE == 'full'
        run: cd openwrt && make -j$(nproc) V=s

      - name: Save build cache
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt/dl
            openwrt/staging_dir
            openwrt/build_dir/host
            openwrt/build_dir/toolchain-*
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Collect artifacts
        if: env.MODE == 'full' && success()
        run: |
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp bin/targets/mediatek/filogic/*sysupgrade.bin "$GITHUB_WORKSPACE/out/" || true
          cp bin/targets/mediatek/filogic/*initramfs* "$GITHUB_WORKSPACE/out/" || true
          cp bin/targets/mediatek/filogic/*.manifest "$GITHUB_WORKSPACE/out/" || true
          cp bin/targets/mediatek/filogic/config.buildinfo "$GITHUB_WORKSPACE/out/" || true
          cd "$GITHUB_WORKSPACE/out"
          sha256sum * > SHA256SUMS
          ls -lh

      - name: Upload
        if: env.MODE == 'full' && success()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.ref || 'v25.12.6' }}-tr3000-256mb
          path: out/
          retention-days: 14

      - name: Publish release
        if: env.MODE == 'full' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TR3000-256MB ${{ inputs.ref || 'v25.12.6' }} build.${{ github.run_number }}
          body: |
            自动构建产物（GitHub Actions）

            - 目标: Cudy TR3000 256MB v1 (MT7981)
            - OpenWrt: ${{ inputs.ref || 'v25.12.6' }}
            - 提交: ${{ github.sha }}
            - 特性: wpad-openssl (802.11r/k/v + WPA3) / BBR / 软件 flow offloading
            - 不含 HNAT（官方内核缺 flow-offload API）
          files: out/*
          draft: false
          prerelease: false
